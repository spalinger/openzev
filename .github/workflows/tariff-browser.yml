name: Tariff browser regressions

on:
    pull_request:
        branches: [main]
        paths:
            - "frontend/**"
            - ".github/workflows/tariff-browser.yml"

permissions:
    contents: read

jobs:
    tariff-browser:
        name: Tariff browser regressions
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .node-version
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies and Chromium
              run: |
                  npm ci
                  npx playwright install --with-deps chromium

            - name: Build frontend
              run: npm run build

            - name: Run tariff browser tests with mocked APIs
              env:
                  SCREENSHOT_BASE_URL: http://127.0.0.1:4173
              run: |
                  npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/tariff-preview.log 2>&1 &
                  preview_pid=$!
                  trap 'kill "$preview_pid"' EXIT
                  for attempt in $(seq 1 30); do
                      curl --fail --silent "$SCREENSHOT_BASE_URL" > /dev/null && break
                      sleep 1
                  done
                  npm run test:browser -- --no-deps --workers=2 screenshots/tariff-*.spec.ts

            - name: Upload browser evidence
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: tariff-browser-failures
                  path: |
                      frontend/test-results/
                      frontend/playwright-report/

