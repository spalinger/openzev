# The outer TLS terminator is trusted only through the loopback-bound Compose
# port. Preserve its HTTPS signal; do not forward arbitrary client values.
map $http_x_forwarded_proto $forwarded_scheme {
  https    https;
  default  $scheme;
}

log_format no_query '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
  listen 8080;
  server_name _;

  # Log only the path; query strings can contain authentication tokens.
  access_log /dev/stdout no_query;
  # Request error messages include the original URI, including query secrets.
  # Failures remain visible in the access log; process diagnostics use stderr.
  error_log /dev/null;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 10m;

  error_page 413 /413.json;
  location = /413.json {
    default_type application/json;
    return 413 '{"detail":"File too large."}';
  }

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite. Do not append; this hop is the only one we trust.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_scheme;
  }

  location / {
    try_files $uri /index.html;
  }
}
