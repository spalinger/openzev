log_format no_query '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
  # Unprivileged port: the Helm chart runs this image as UID 10001.
  listen 8080;
  server_name _;

  # Log only the path; query strings can contain authentication tokens.
  access_log /dev/stdout no_query;
  # Request error messages include the original URI, including query secrets.
  # Failures remain visible in the access log; process diagnostics use stderr.
  error_log /dev/null;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 10m;

  error_page 413 /413.json;
  location = /413.json {
    default_type application/json;
    return 413 '{"detail":"File too large."}';
  }

  location / {
    try_files $uri /index.html;
  }
}
